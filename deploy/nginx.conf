server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  # Canonical host: www -> apex (HTTPS is handled by Coolify's proxy)
  if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

  if ($request_uri ~ "^/index\.html(\?.*)?$") { return 301 /; }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json text/xml application/xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Old WordPress booking page -> live reservation system
  location ~ ^/(booking|reserve|reservations|book)/?$ { return 302 https://book.mylimobiz.com/v4/vztravelcorp; }
  # Old WordPress URLs -> home
  location ~ ^/(home|sample-page|wp-login\.php|feed)/?$ { return 301 /; }
  location = /site.webmanifest { default_type application/manifest+json; add_header Cache-Control "public, max-age=0, must-revalidate" always; }

  location ~* \.(css|js|png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
